<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Likes Me</title>

<style>
:root {
  --primary: #ff426d;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
}

/* La cámara ocupa toda la página */
video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  display: none;
}

/* Botón inicial, único texto de la página */
.start {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
}

button {
  font: inherit;
  cursor: pointer;
  border: 0;
  background: var(--primary);
  color: #fff;
  font-weight: 800;
  border-radius: 999px;
  padding: 14px 26px;
  box-shadow: 0 8px 24px #ff426d30;
  transition: transform .15s, filter .15s;
}
button:hover { filter: brightness(1.08); transform: translateY(-1px); }
button:disabled { opacity: .5; cursor: wait; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

/* Corazón + contador, abajo a la izquierda, sobre la cámara */
.counter {
  position: fixed;
  left: max(20px, env(safe-area-inset-left));
  bottom: max(20px, env(safe-area-inset-bottom));
  display: none;
  align-items: center;
  gap: 12px;
  text-shadow: 0 2px 16px rgba(0, 0, 0, .55);
}

.heart {
  color: var(--primary);
  font-size: clamp(36px, 6vw, 54px);
  line-height: 1;
  animation: beat 1.2s infinite;
  filter: drop-shadow(0 2px 12px rgba(0, 0, 0, .45));
}

.count {
  font-size: clamp(36px, 6vw, 56px);
  font-weight: 900;
  letter-spacing: -.08em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  8% { transform: scale(1.13); }
  18% { transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .heart { animation: none; }
  button { transition: none; }
}
</style>
</head>

<body>
<video id="video" autoplay muted playsinline></video>

<div class="start" id="start">
  <button id="startCamera" type="button">Activar cámara</button>
</div>

<div class="counter" id="counter">
  <div class="heart" aria-hidden="true">♥</div>
  <div class="count" id="count">0</div>
</div>

<p class="sr-only" id="status" role="status" aria-live="polite"></p>

<script>
const $ = (id) => document.getElementById(id);
const video = $('video');
const startBox = $('start');
const startBtn = $('startCamera');
const counter = $('counter');
const countEl = $('count');
const statusEl = $('status');

const LIKES_KEY = 'likes-me-total';

function safeGet(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function safeSet(key, value) {
  try { localStorage.setItem(key, value); } catch { /* almacenamiento bloqueado */ }
}

/* El total se acumula entre visitas (en este navegador) */
let likes = Number(safeGet(LIKES_KEY)) || 0;
let timer = null;

function paint() {
  countEl.textContent = likes.toLocaleString('es-UY');
  safeSet(LIKES_KEY, String(likes));
}

/* Sonido: un "pop" suave generado con Web Audio (no necesita archivos).
   El AudioContext se crea al tocar el botón, así el navegador permite el audio. */
let audioCtx = null;

function initAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = audioCtx || new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch { audioCtx = null; }
}

function playLike() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'sine';
  osc.frequency.setValueAtTime(660, t);
  osc.frequency.exponentialRampToValueAtTime(1100, t + 0.09);

  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);

  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.3);
}

/* +1 cada 2 segundos, desde el momento en que se activa la cámara.
   No suma si la pestaña está oculta. */
function tick() {
  if (document.hidden) return;
  likes += 1;
  paint();
  playLike();
}

function stopCamera() {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach((t) => t.stop());
    video.srcObject = null;
  }
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  initAudio();

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('unsupported');
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    video.style.display = 'block';
    startBox.style.display = 'none';
    counter.style.display = 'flex';

    paint();
    clearInterval(timer);
    timer = setInterval(tick, 2000);
  } catch (error) {
    stopCamera();
    startBtn.textContent = 'Reintentar';
    statusEl.textContent = 'No se pudo activar la cámara. Revisá el permiso en tu navegador e intentá de nuevo.';
  } finally {
    startBtn.disabled = false;
  }
});

window.addEventListener('pagehide', () => {
  clearInterval(timer);
  timer = null;
  stopCamera();
});
</script>
</body>
</html>
