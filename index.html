<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Like Me</title>

<style>
:root {
  --site-primary: #ff426d;
  --site-on-primary: #ffffff;
  --site-secondary: #211d2b;
  --site-on-secondary: #ffffff;
  --site-background: #000000;
  --site-on-background: #ffffff;
  --site-font-body: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --site-font-heading: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
  color-scheme: light dark;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--site-background);
  color: var(--site-on-background);
  font-family: var(--site-font-body);
}

#app {
  min-height: 100svh;
  width: 100%;
  border-radius: 0;
  background: var(--site-background);
  position: relative;
  overflow: hidden;
}

.glow {
  display: none;
}

header {
  display: none;
}

.wordmark {
  font-weight: 900;
  letter-spacing: -.07em;
  font-size: calc(25px * var(--site-heading-scale));
}

.wordmark span {
  color: var(--site-primary);
}

.pill {
  border: 1px solid #ffffff2b;
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 11px;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: #d7ced8;
}

main {
  max-width: 560px;
  margin: auto;
  padding: 0;
  position: relative;
  z-index: 1;
  min-height: 100svh;
  display: flex;
  align-items: center;
}

.intro {
  display: none;
}

.eyebrow {
  color: var(--site-primary);
  text-transform: uppercase;
  letter-spacing: .2em;
  font-size: 11px;
  font-weight: 800;
}

h1 {
  font-family: var(--site-font-heading);
  font-size: clamp(38px, 8vw, 70px);
  letter-spacing: -.065em;
  line-height: .95;
  margin: 14px 0;
}

h1 em {
  font-style: normal;
  color: var(--site-primary);
}

.sub {
  max-width: 470px;
  margin: 0 auto;
  color: #bdb4c3;
  line-height: 1.6;
  font-size: 14px;
}

.stage {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0;
  align-items: stretch;
}

.camera-card,
.stats-card {
  border: 0;
  border-radius: 0;
  overflow: hidden;
  background: #000;
  color: #fff;
}

.camera-card {
  position: relative;
  min-height: 65svh;
  height: 65svh;
  background: #000;
}

video {
  width: 100%;
  height: 100%;
  min-height: 65svh;
  object-fit: cover;
  transform: scaleX(-1);
  display: block;
  opacity: 1;
}

.camera-empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px;
  text-align: center;
  color: #fff;
  background: #000;
}

.camera-empty button {
  margin-top: 16px;
  background: var(--site-primary);
  color: white;
  font-weight: 800;
  border-radius: 999px;
  padding: 13px 19px;
}

.camera-icon {
  width: 64px;
  height: 64px;
  border: 1px solid #ffffff55;
  border-radius: 22px;
  display: grid;
  place-items: center;
  font-size: 28px;
  margin-bottom: 18px;
}

.camera-empty h2 {
  display: none;
}

.camera-empty p {
  display: none;
}

button {
  font: inherit;
  cursor: pointer;
  border: 0;
}

.primary {
  background: var(--site-primary);
  color: white;
  font-weight: 800;
  border-radius: 999px;
  padding: 13px 19px;
  box-shadow: 0 8px 24px #ff426d30;
  transition: transform .15s, filter .15s;
}

.primary:hover {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

.primary:disabled {
  opacity: .5;
  cursor: wait;
}

.cam-label {
  display: none;
}

.face-frame {
  display: none;
  position: absolute;
  inset: 18% 20%;
  border: 1px solid #ff6689a8;
  border-radius: 48% 48% 42% 42%;
  pointer-events: none;
  box-shadow: 0 0 35px #ff426d18;
}

.live-heart {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(.7);
  color: #ff426d;
  font-size: clamp(58px, 10vw, 100px);
  opacity: 0;
  filter: drop-shadow(0 8px 24px #ff426d80);
  pointer-events: none;
  transition: opacity .2s, transform .2s;
}

.live-heart.on {
  opacity: .9;
  transform: translate(-50%, -50%) scale(1);
}

/* Zona de likes con fondo transparente */
.stats-card {
  padding: 20px 24px 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 0;
  background: transparent;
  text-align: center;
}

.stat-top {
  display: none;
}

.status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #777;
  margin-right: 7px;
}

.status-dot.active {
  background: #51e0a0;
  box-shadow: 0 0 10px #51e0a080;
}

.counter-wrap {
  text-align: center;
  padding: 0;
}

/* Corazón a la izquierda del contador */
.count-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.big-heart {
  display: block;
  color: var(--site-primary);
  font-size: clamp(36px, 6vw, 54px);
  line-height: 1;
  flex-shrink: 0;
  animation: beat 1.2s infinite;
}

.count {
  font-size: clamp(58px, 8vw, 88px);
  font-weight: 900;
  letter-spacing: -.08em;
  line-height: 1.1;
  margin: 14px 0 4px;
  font-variant-numeric: tabular-nums;
}

.count-caption {
  display: none;
}

.meter {
  display: none;
}

.meter span {
  display: block;
  width: 0%;
  height: 100%;
  background: var(--site-primary);
  transition: width .25s;
}

.status-text {
  display: none;
}

.controls {
  display: none;
  gap: 10px;
  margin-top: 14px;
  justify-content: center;
}

.controls button {
  flex: 1;
  padding: 12px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
}

.secondary {
  background: transparent;
  color: #aaa;
  border: 1px solid #444;
}

.small-note {
  display: none;
}

footer {
  display: none;
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  8% { transform: scale(1.13); }
  18% { transform: scale(1); }
}

@media (max-width: 680px) {
  main {
    padding: 0;
  }

  .camera-card,
  .camera-card video {
    min-height: 65svh;
    height: 65svh;
  }

  .stats-card {
    min-height: 0;
  }

  .count {
    font-size: 64px;
    margin: 0;
  }

  .controls {
    margin-top: 10px;
  }
}
</style>
</head>

<body>
<div id="app">
  <div class="glow"></div>

  <header>
  
  </header>

  <main>
    <section class="intro">
      <p class="sub">
      
      </p>
    </section>

    <section class="stage">
      <div class="camera-card">
        <div class="cam-label" id="camLabel">● cámara apagada</div>

        <video
          id="video"
          autoplay
          muted
          playsinline
          style="display:none"
        ></video>

        <div class="camera-empty" id="empty">
          <div class="camera-icon">♥</div>
          <h2>Like Me</h2>
          <p style="display:block">
          </p>
          <button id="startCamera">Activar cámara</button>
        </div>

        <div class="face-frame" id="frame"></div>
        <div class="live-heart" id="liveHeart">♥</div>
      </div>

      <div class="stats-card">
        <div class="stat-top">
          <span>
            <i class="status-dot" id="dot"></i>
            <span id="liveStatus">EN ESPERA</span>
          </span>
        </div>

        <div class="counter-wrap">
          <div class="count-line">
            <div class="big-heart" aria-label="Me gusta">♥</div>
            <div class="count" id="count">0</div>
          </div>

          <div class="count-caption">likes recibidos</div>
          <div class="meter"><span id="meter"></span></div>
          <div class="status-text" id="status">
            Tu contador está esperando una mirada.
          </div>
        </div>

        <div>
          <div class="controls">
            <button class="secondary" id="pause">Pausar</button>
            <button class="secondary" id="reset">Reiniciar</button>
          </div>

          <p class="small-note">
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer>
  </footer>
</div>

<script>
const countEl = document.getElementById('count');
const statusEl = document.getElementById('status');
const liveStatus = document.getElementById('liveStatus');
const dot = document.getElementById('dot');
const frame = document.getElementById('frame');
const heart = document.getElementById('liveHeart');
const meter = document.getElementById('meter');
const pauseBtn = document.getElementById('pause');
const video = document.getElementById('video');
const empty = document.getElementById('empty');

let cameraActive = false;
let paused = false;
let lastTick = performance.now();
let raf = null;

/* Activar la cámara */
document.getElementById('startCamera').addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    video.style.display = 'block';
    empty.style.display = 'none';

    cameraActive = true;
    lastTick = performance.now();

    statusEl.textContent =
      'La cámara está activa. Sumando +1 like por segundo.';

  } catch (error) {
    statusEl.textContent =
      'No se pudo activar la cámara. Permití el acceso en tu navegador e intentá de nuevo.';
  }
});

/*

*/

const likesKey = 'likes-me-total';
let likes = Number(localStorage.getItem(likesKey) || 0);

/* Actualizar el número en pantalla */
function paint() {
  countEl.textContent = likes.toLocaleString('es-UY');
  meter.style.width = (likes % 11) / 10 * 100 + '%';

  localStorage.setItem(likesKey, String(likes));
}

/* Sumar likes mientras la cámara está activa */
function countLoop() {
  const now = performance.now();

  if (
    cameraActive &&
    !paused &&
    now - lastTick >= 1000
  ) {
    const seconds = Math.floor((now - lastTick) / 1000);

    likes += Math.max(1, seconds);
    lastTick = now;

    paint();

    heart.classList.add('on');
    setTimeout(() => heart.classList.remove('on'), 250);
  }

  raf = requestAnimationFrame(countLoop);
}

/* Función de pausa, aunque el botón no se muestra */
pauseBtn.addEventListener('click', () => {
  paused = !paused;

  pauseBtn.textContent = paused ? 'Continuar' : 'Pausar';

  dot.classList.toggle('active', !paused);

  liveStatus.textContent = paused
    ? 'PAUSADO'
    : 'LIKES EN VIVO';

  statusEl.textContent = paused
    ? 'Contador en pausa.'

  lastTick = performance.now();
});

/* El contador acumulado no se reinicia desde esta página */
document.getElementById('reset').addEventListener('click', () => {
  statusEl.textContent =
});

/* Estado inicial */
paint();

dot.classList.remove('active');
liveStatus.textContent = 'EN ESPERA';
statusEl.textContent = 'Activá la cámara para comenzar.';

countLoop();

/* Detener la cámara al salir de la página */
window.addEventListener('pagehide', () => {
  if (raf) {
    cancelAnimationFrame(raf);
  }

  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
  }
});
</script>
</body>
</html>
