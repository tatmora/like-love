<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Likes Me</title>

<style>
:root {
  --primary: #ff426d;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow: hidden;
}

/* La cámara ocupa toda la página */
video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  display: none;
}

/* Botón inicial, único texto de la página */
.start {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
}

button {
  font: inherit;
  cursor: pointer;
  border: 0;
  background: var(--primary);
  color: #fff;
  font-weight: 800;
  border-radius: 999px;
  padding: 14px 26px;
  box-shadow: 0 8px 24px #ff426d30;
  transition: transform .15s, filter .15s;
}
button:hover { filter: brightness(1.08); transform: translateY(-1px); }
button:disabled { opacity: .5; cursor: wait; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

/* Corazón + contador, abajo a la izquierda, sobre la cámara */
.counter {
  position: fixed;
  left: max(20px, env(safe-area-inset-left));
  bottom: max(20px, env(safe-area-inset-bottom));
  display: none;
  align-items: center;
  gap: 12px;
  text-shadow: 0 2px 16px rgba(0, 0, 0, .55);
}

.heart {
  color: var(--primary);
  font-size: clamp(36px, 6vw, 54px);
  line-height: 1;
  animation: beat 1.2s infinite;
  filter: drop-shadow(0 2px 12px rgba(0, 0, 0, .45));
}

.count {
  font-size: clamp(25px, 4.2vw, 39px);
  font-weight: 900;
  letter-spacing: -.08em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  8% { transform: scale(1.13); }
  18% { transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .heart { animation: none; }
  button { transition: none; }
}
</style>
</head>

<body>
<video id="video" autoplay muted playsinline></video>

<div class="start" id="start">
  <button id="startCamera" type="button">Activar cámara</button>
</div>

<div class="counter" id="counter">
  <div class="heart" aria-hidden="true">♥</div>
  <div class="count" id="count">0</div>
</div>

<p class="sr-only" id="status" role="status" aria-live="polite"></p>

<script>
const $ = (id) => document.getElementById(id);
const video = $('video');
const startBox = $('start');
const startBtn = $('startCamera');
const counter = $('counter');
const countEl = $('count');
const statusEl = $('status');

const LIKES_KEY = 'likes-me-total';

function safeGet(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function safeSet(key, value) {
  try { localStorage.setItem(key, value); } catch { /* almacenamiento bloqueado */ }
}

/* El total se acumula entre visitas (en este navegador) */
let likes = Number(safeGet(LIKES_KEY)) || 0;
let timer = null;

function paint() {
  countEl.textContent = likes.toLocaleString('es-UY');
  safeSet(LIKES_KEY, String(likes));
}

/* Sonido: un "pop" generado en código como un WAV y reproducido con <audio>.
   Se usa <audio> (y no Web Audio) porque suena aunque el iPhone esté en silencio
   y no queda bloqueado al activar la cámara. */
let popAudio = null;

function makePopWav() {
  const sr = 22050;
  const n = Math.floor(sr * 0.35);
  const buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };

  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, n * 2, true);

  let phase = 0;
  for (let i = 0; i < n; i++) {
    const t = i / sr;
    const freq = 660 + 440 * Math.min(1, t / 0.09);
    phase += (2 * Math.PI * freq) / sr;
    const env = t < 0.01 ? t / 0.01 : Math.exp(-(t - 0.01) * 12);
    v.setInt16(44 + i * 2, Math.sin(phase) * env * 0.9 * 32767, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

function initAudio() {
  try {
    if (!popAudio) {
      popAudio = new Audio(URL.createObjectURL(makePopWav()));
      popAudio.preload = 'auto';
    }
    popAudio.volume = 1;
    /* Se reproduce una vez dentro del toque del usuario para desbloquear el audio */
    popAudio.play().catch(() => {});
  } catch { popAudio = null; }
}

function playLike() {
  if (!popAudio) return;
  popAudio.currentTime = 0;
  popAudio.play().catch(() => {});
}

/* +1 cada 2 segundos, desde el momento en que se activa la cámara.
   No suma si la pestaña está oculta. */
function tick() {
  if (document.hidden) return;
  likes += 1;
  paint();
  playLike();
}

function stopCamera() {
  if (video.srcObject) {
    video.srcObject.getTracks().forEach((t) => t.stop());
    video.srcObject = null;
  }
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  initAudio();

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('unsupported');
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user' },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    video.style.display = 'block';
    startBox.style.display = 'none';
    counter.style.display = 'flex';

    paint();
    clearInterval(timer);
    timer = setInterval(tick, 2000);
  } catch (error) {
    stopCamera();
    startBtn.textContent = 'Reintentar';
    statusEl.textContent = 'No se pudo activar la cámara. Revisá el permiso en tu navegador e intentá de nuevo.';
  } finally {
    startBtn.disabled = false;
  }
});

window.addEventListener('pagehide', () => {
  clearInterval(timer);
  timer = null;
  stopCamera();
});
</script>
</body>
</html>
